# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wheekly.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wheekly.example.com;

    ssl_certificate     /etc/letsencrypt/live/wheekly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wheekly.example.com/privkey.pem;

    root  /srv/wheekly/www;
    index index.html;

    # Password-protect the whole site so the browser asks once on page load.
    # Later fetch() calls to /dbs/ then reuse the cached credentials automatically.
    auth_basic           "wheekly";
    auth_basic_user_file /etc/nginx/wheekly.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # SQLite files: GET to load, PUT to save
    location /dbs/ {
        root /srv/wheekly;              # maps to /srv/wheekly/dbs/...
        autoindex off;

        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:r;
        client_max_body_size 16m;       # default 1m; raise it so the DB can grow
        client_body_temp_path /srv/wheekly/tmp;   # same filesystem, so the save is an atomic rename

        # Allow only read/write; reject DELETE and anything else
        limit_except GET HEAD PUT {
            deny all;
        }

        add_header Cache-Control "no-store" always;
        types { application/vnd.sqlite3 sqlite sqlite3 db; }
    }
}
